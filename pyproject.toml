[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-enhancer"
version = "0.1.0"
description = "Free local FFmpeg video enhancer with upscaling and frame interpolation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "bjork", email = "bjorke.poc@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["video", "ffmpeg", "upscaling", "frame-interpolation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = ["yt-dlp[default,curl-cffi]>=2026.7.4"]

[project.urls]
Homepage = "https://github.com/bjorkepoc/video-enhancer"
Repository = "https://github.com/bjorkepoc/video-enhancer"
Issues = "https://github.com/bjorkepoc/video-enhancer/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.5"]
macos = ["imageio-ffmpeg==0.6.0", "pyinstaller==6.21.0"]

[dependency-groups]
release = [
  "build==1.5.0",
  "setuptools==83.0.0",
  "twine==7.0.0",
  "wheel==0.47.0",
]

[project.scripts]
video-enhancer = "video_enhancer.cli:main"
video-enhancer-web = "video_enhancer.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
