name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            python-version: "3.10"
          - runner: ubuntu-latest
            python-version: "3.11"
          - runner: ubuntu-latest
            python-version: "3.12"
          - runner: windows-2025
            python-version: "3.12"
          - runner: macos-15
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Lint
        if: matrix.runner == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m ruff check src tests
      - name: Verify release artifacts
        if: matrix.runner == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz

  security:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
      - name: Audit macOS extra dependencies
        run: |
          uv export --locked --no-dev --extra macos --group release \
            --no-emit-project --format requirements-txt \
            --output-file audit-macos-extra.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            -r audit-macos-extra.txt --strict --progress-spinner off
      - name: Audit default wheel dependencies
        run: |
          uv export --locked --no-dev \
            --no-emit-project --format requirements-txt \
            --output-file audit-default.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            -r audit-default.txt --strict --progress-spinner off
      - name: Scan Python source
        run: uvx --from bandit==1.9.4 bandit -q -r src --skip B404,B603

  macos-package-test:
    name: Package macOS ${{ matrix.arch }}
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
      - name: Install locked macOS dependencies
        run: uv sync --locked --no-dev --extra macos
      - name: Build and verify ad-hoc package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          PYTHON_BIN="$PWD/.venv/bin/python" bash scripts/build_macos.sh
          cd dist
          shasum -a 256 -c Video-Enhancer-*-macos-${TARGET_ARCH}.zip.sha256

  release-build:
    name: Build macOS ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-test, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
      - name: Verify tag matches package version
        run: python -c 'import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == f"v{version}"'
      - name: Install locked release dependencies
        run: |
          uv sync --locked --no-dev --extra macos --group release --no-install-project
          uv sync --locked --no-dev --extra macos --group release --no-build-isolation
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY; do
            test -n "${!name}" || { echo "::error::$name secret is required"; exit 1; }
          done
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          CERTIFICATE_PATH="$certificate" python -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_BASE64"]))'
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$MACOS_SIGNING_IDENTITY"
      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            test -n "${!name}" || { echo "::error::$name secret is required"; exit 1; }
          done
          xcrun notarytool store-credentials video-enhancer-ci \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
      - name: Build signed and notarized macOS artifact
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PROFILE: video-enhancer-ci
          TARGET_ARCH: ${{ matrix.arch }}
        run: PYTHON_BIN="$PWD/.venv/bin/python" bash scripts/build_macos.sh
      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/Video-Enhancer-*-macos-${{ matrix.arch }}.zip
            dist/Video-Enhancer-*-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  release-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
      - name: Verify tag matches package version
        run: python -c 'import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == f"v{version}"'
      - name: Install locked publication dependencies
        run: |
          uv sync --locked --no-dev --group release --no-install-project
          uv sync --locked --no-dev --group release --no-build-isolation
      - name: Build Python artifacts
        run: |
          .venv/bin/python -m build --no-isolation
          .venv/bin/python -m twine check dist/*.whl dist/*.tar.gz
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - name: Verify and checksum release artifacts
        run: |
          test -f dist/Video-Enhancer-*-macos-arm64.zip
          test -f dist/Video-Enhancer-*-macos-x86_64.zip
          cd dist
          sha256sum -c Video-Enhancer-*-macos-arm64.zip.sha256
          sha256sum -c Video-Enhancer-*-macos-x86_64.zip.sha256
          sha256sum *.whl *.tar.gz Video-Enhancer-*.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*.whl dist/*.tar.gz dist/Video-Enhancer-*.zip
            dist/Video-Enhancer-*.zip.sha256 dist/SHA256SUMS)
          flags=(--generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*alpha*|*beta*|*dev*) flags+=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${flags[@]}"
          fi
